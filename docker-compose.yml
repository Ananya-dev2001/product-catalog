version: "3.8"

services:
  mongo:
    image: mongo:7
    container_name: catalog-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    container_name: catalog-backend
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/catalog
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mongo-data:
