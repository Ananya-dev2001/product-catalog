spring:
  application:
    name: product-catalog
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.example.catalog: INFO
